# Run with `dart run ffigen --config ffigen.yaml`.
name: FrostdartBindings
ffi-native:
  asset-id: package:frostdart/frostdart_bindings_generated.dart
enums:
  as-int:
    include:
      - Network
description: |
  Bindings for `src/serai/hrf/header.h`.

  Regenerate bindings with `dart run ffigen --config ffigen.yaml`.
output: 'lib/frostdart_bindings_generated.dart'
headers:
  entry-points:
    - 'src/serai/hrf/header.h'
  include-directives:
    - 'src/serai/hrf/header.h'
preamble: |
  // ignore_for_file: always_specify_types
  // ignore_for_file: camel_case_types
  // ignore_for_file: non_constant_identifier_names
comments:
  style: any
  length: full
