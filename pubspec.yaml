name: frostdart
description: Dart FFI bindings for Serai FROST threshold-signed Bitcoin wallets, built with native assets.
version: 0.3.0
homepage: https://github.com/cypherstack/frostdart

environment:
  sdk: ^3.13.0

dependencies:
  ffi: ^2.0.1
  hooks: ^2.2.0
  code_assets: ^1.2.1
  dnix:
    git:
      url: https://github.com/slopbot9k/dnix.git
      ref: c6b2a9d3977b7dd0654dc729eefa6f3e3bdeea08

dev_dependencies:
  test: ^1.26.3
  ffigen: ^21.0.0
  flutter_lints: ^2.0.0
