version: 0.3.0
homepage: https://github.com/cypherstack/frostdart

environment:
  sdk: ^3.13.0

dependencies:
  ffi: ^2.0.1
  hooks: ^2.2.0
  code_assets: ^1.2.1

dev_dependencies:
  test: ^1.26.3
  ffigen: ^21.0.0
  flutter_lints: ^2.0.0
